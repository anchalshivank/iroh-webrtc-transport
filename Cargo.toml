[package]
name = "iroh-webrtc-transport"
version = "0.1.0"
edition = "2024"

[features]
default = []
# WebSocket JSEP signaling + the ws/bin demo tooling (not needed by iroh endpoints).
ws = ["dep:tokio-tungstenite", "dep:axum", "dep:tower-http"]
# nym mixnet demo example only.
nym = ["dep:nym-sdk", "dep:nym-noise-keys"]

[dependencies]
tokio = { version = "1", features = ["full"] }
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
n0-watcher = "1.0.0"
noq-udp = { version = "1.3.0", default-features = false }
iroh-base = { version = "1.3.0", default-features = false, features = ["key", "relay"] }
anyhow = "1.0.102"
str0m = "0.19"
str0m-aws-lc-rs = "0.4"
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = { version = "0.26", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
nym-sdk = { version = "1.20.4", optional = true }
nym-noise-keys = { version = "=1.20.4", optional = true }

[dev-dependencies]
bytes = "1"
iroh = { version = "1.3.0", features = ["tls-ring", "unstable-custom-transports"] }
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "signaling-server"
path = "src/bin/signaling_server.rs"
required-features = ["ws"]

[[bin]]
name = "static-server"
path = "src/bin/static_server.rs"
required-features = ["ws"]

[[bin]]
name = "ws-chat"
path = "src/bin/ws_chat.rs"
required-features = ["ws"]

[[bin]]
name = "iroh-jsep-chat"
path = "src/bin/iroh_jsep_chat.rs"

[[example]]
name = "chat"
required-features = ["nym"]
